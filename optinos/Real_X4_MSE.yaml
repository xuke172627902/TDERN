# general settings
name: Real_X4_MSE
# for real SR training, ESC is necessary; refer to https://github.com/dslisleedh/ESC for more details; using sec/train.py to start training
model_type: RealCovMSEModel
scale: 4
num_gpu: 1
manual_seed: 0

# USM the ground-truth
gt_usm: True

# the first degradation process
resize_prob: [0.2, 0.7, 0.1]
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.5
noise_range: [1, 30]
poisson_scale_range: [0.05, 3]
gray_noise_prob: 0.4
jpeg_range: [30, 95]

# the second degradation process
second_blur_prob: 0.8
resize_prob2: [0.3, 0.4, 0.3]
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.5
noise_range2: [1, 25]
poisson_scale_range2: [0.05, 2.5]
gray_noise_prob2: 0.4
jpeg_range2: [30, 95]

gt_size: 256
queue_size: 120

# dataset and data loader settings
datasets:
  train:
    name: OST_DF
    type: RealESRGANDataset
    dataroot_gt: /media/xuke/E26665286664FF23/ablation_study/dataset/DF_OST_HR
    meta_info: /media/xuke/E26665286664FF23/ablation_study/dataset/meta_info_DF_OST_HR.txt
    io_backend:
      type: disk

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    gt_size: 256
    use_hflip: True
    use_rot: False

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 20
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

# network structures
network_g:
  type: TDERN
  img_size: 64
  patch_size: 1
  in_chans: 3
  embed_dim: 144
  depths: [4, 4, 4, 4, 4, 4]
  num_heads: [12, 12, 12, 12, 12, 12]
  window_size: 16
  convffn_kernel_size: 7
  mlp_ratio: 2
  qkv_bias: true
  upscale: 4
  img_range: 1.
  upsampler: 'nearest+conv'
  resi_connection: '1conv'
  num_tokens: 64
  reducted_dim: 36
  num_feat: 64

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [250000*2, 400000*2, 450000*2, 475000*2]
    gamma: 0.5

  total_iter: 1000000
  warmup_iter: -1

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  fft_opt:
    type: FFTLoss
    FFTweight: 0.05
    loss_weight: 1.0
    reduction: mean

  coverage_loss_weight: 0

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
